<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Centro de Avances</title>
<style>
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  color-scheme:dark;
  --bg:#05080f; --bg2:#0a1120; --panel:rgba(255,255,255,.045); --panel-s:#0f1829; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --text:#e9effc; --muted:#93a4c6; --cyan:#22d3ee; --blue:#5b8cff; --amber:#ffb547; --red:#ff5d73; --green:#34e0a1; --gray:#8091b3;
  --glow1:rgba(34,211,238,.20); --glow2:rgba(91,140,255,.22); --grid:rgba(255,255,255,.035);
  --ok-bg:rgba(52,224,161,.12); --run-bg:rgba(91,140,255,.14); --val-bg:rgba(255,181,71,.13); --pend-bg:rgba(128,145,179,.14); --block-bg:rgba(255,93,115,.14);
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --mono:"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --disp:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cyan)}
/* fondo vivo */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2))}
.bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 15%,#000 15%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 15%,#000 15%,transparent 75%);animation:gridmove 30s linear infinite}
@keyframes gridmove{to{background-position:56px 56px}}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-14vw;background:var(--glow1)}
.bg i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:12vh;background:var(--glow2);animation-duration:31s;animation-delay:-8s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}
/* barra superior */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:18px;padding:12px clamp(16px,3vw,40px);background:rgba(5,8,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from var(--ang),var(--cyan),var(--blue),var(--cyan));display:grid;place-items:center;position:relative;animation:spin 6s linear infinite}
.logo::after{content:"";position:absolute;inset:3px;border-radius:7px;background:var(--bg)}
.logo b{position:relative;z-index:1;font-size:11px;font-family:var(--mono);color:var(--cyan)}
@keyframes spin{to{--ang:360deg}}
.tabs{display:flex;gap:4px;margin-left:10px;overflow-x:auto}
.tab{background:none;border:0;border-radius:10px;padding:8px 14px;color:var(--muted);font-weight:600;position:relative;white-space:nowrap;transition:color .2s,background .2s}
.tab:hover{color:var(--text);background:var(--panel)}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.tab .cb{font-family:var(--mono);font-size:11px;margin-left:6px;background:var(--val-bg);color:var(--amber);border-radius:10px;padding:0 6px}
.top .sp{flex:1}
.chip{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,3vw,40px) 80px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:1.25fr .9fr;gap:clamp(20px,4vw,56px);align-items:center;margin-bottom:34px;padding:clamp(8px,2vw,24px) 0}
#fx{position:absolute;inset:-20px -30px;width:calc(100% + 60px);height:calc(100% + 40px);pointer-events:none;opacity:.7;z-index:0}
.hero>*{position:relative;z-index:1}
h1{font-family:var(--disp);font-size:clamp(34px,5.2vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:600;margin:0 0 18px}
h1 .g{background:linear-gradient(100deg,var(--cyan),var(--blue),var(--cyan));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.lead{color:var(--muted);font-size:16px;max-width:54ch;margin:0 0 24px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:12px;padding:11px 18px;font-weight:600;border:1px solid var(--line2);background:var(--panel);transition:transform .15s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}
.btn.pri{background:linear-gradient(100deg,var(--cyan),var(--blue));border-color:transparent;color:#04101c}
.btn.pri:hover{box-shadow:0 8px 28px var(--glow2)}
.ringwrap{display:grid;place-items:center;position:relative}
.ring{width:min(100%,320px);aspect-ratio:1;overflow:visible}
.ring circle{fill:none;stroke-width:11;transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1),opacity .2s}
.ring .track{stroke:var(--line)}
.ring.dim circle.seg{opacity:.22}.ring.dim circle.seg.hot{opacity:1}
.ringc{position:absolute;text-align:center;pointer-events:none}
.ringc b{display:block;font-family:var(--disp);font-size:64px;line-height:1;letter-spacing:-.04em}
.ringc span{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 11px;transition:border-color .2s}
.lg:hover{border-color:var(--line2)}
.lg i{width:8px;height:8px;border-radius:50%}
.lg b{font-family:var(--mono)}
/* narrativa */
.story{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:22px;overflow:hidden}
.story div{padding:16px 18px;border-right:1px solid var(--line)}
.story div:last-child{border:0}
.story small{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.story p{margin:4px 0 0;font-weight:600}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
.kpi{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}
.kpi .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .num{font-family:var(--disp);font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
.kpi .num small{font-size:20px;color:var(--muted);font-weight:500}
.kpi .def{font-size:12.5px;color:var(--muted)}
.segbar{display:flex;gap:3px;margin:6px 0 10px}
.segbar i{flex:1;height:8px;border-radius:3px;background:var(--line);min-width:2px}
.segbar i.on{background:var(--green);transform-origin:left;animation:grow .5s both;animation-delay:calc(var(--i)*40ms)}
.segbar i.ev{background:var(--cyan)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h2{font-family:var(--disp);font-size:22px;letter-spacing:-.02em;margin:44px 0 16px;display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
h2 .n{font-family:var(--mono);font-size:12px;color:var(--cyan);border:1px solid var(--line);border-radius:20px;padding:1px 10px}
h2 small{font-family:inherit;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.pnl{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.pnl.alert{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.pnl h3{margin:0;padding:14px 18px;font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 18px;background:none;border:0;border-bottom:1px solid var(--line);transition:background .2s}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--panel)}
.row .t{font-weight:600}.row .m{font-size:13px;color:var(--muted)}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}
/* franja de días */
.stripwrap{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:20px 18px 14px;overflow-x:auto}
.strip{display:flex;gap:6px;align-items:flex-end;min-width:max-content;min-height:150px}
.day{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;border-radius:12px;padding:6px 2px;position:relative}
.day.we{background:rgba(255,255,255,.02)}
.day.today{background:linear-gradient(180deg,transparent,var(--glow1));box-shadow:inset 0 -2px 0 var(--cyan)}
.stack{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;min-height:20px}
.dl{text-align:center;line-height:1.1;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dl b{display:block;font-size:14px;color:var(--text);font-weight:600}
.day.today .dl b{color:var(--cyan)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--pc);background:transparent;padding:0;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k)*45ms + 250ms);transition:transform .15s,opacity .2s}
.dot.f{background:var(--pc);box-shadow:0 0 12px color-mix(in srgb,var(--pc) 55%,transparent)}
.dot.ov{border-color:var(--red);box-shadow:0 0 0 3px var(--block-bg)}
.dot:hover,.dot:focus-visible{transform:scale(1.4)}
.dot.dim{opacity:.18}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.slegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted);align-items:center}
.slegend .sym{display:inline-flex;align-items:center;gap:6px}
.slegend .sym i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.slegend .sym i.f{background:var(--muted)}
.slegend .sym i.ov{border-color:var(--red)}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--panel)}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
button.pchip:hover{border-color:var(--pc)}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--panel-s);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:13px;max-width:280px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip small{display:block;color:var(--muted);font-size:12px}
/* tarjetas de proyecto */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{--mx:50%;--my:0%;position:relative;border:1px solid var(--line);border-radius:20px;padding:22px;background:radial-gradient(420px circle at var(--mx) var(--my),var(--glow1),transparent 60%),var(--panel);display:flex;flex-direction:column;gap:14px;transition:transform .2s,border-color .2s;text-align:left}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 72%,var(--pc) 88%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:spin 4s linear infinite;pointer-events:none}
.card:hover{transform:translateY(-3px);border-color:var(--line2)}
.card:hover::before{opacity:1}
.card .id{font-family:var(--mono);font-size:12px;color:var(--pc);display:flex;align-items:center;gap:8px}
.card .id i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.card h3{margin:0;font-family:var(--disp);font-size:20px;letter-spacing:-.015em;font-weight:600}
.card .obj{margin:0;color:var(--muted);font-size:13.5px}
.seq{display:flex;align-items:center;flex-wrap:wrap;gap:0;row-gap:8px}
.nd{width:16px;height:16px;border-radius:50%;border:2px solid var(--pc);background:transparent;flex:none;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms + 200ms)}
.nd.f{background:var(--pc)}
.nd.ov{border-color:var(--red)}
.seq .ln{width:14px;height:2px;background:var(--line2);flex:none;transform-origin:left;animation:grow .4s both;animation-delay:calc(var(--i)*70ms + 250ms)}
.seq .ln.f{background:var(--pc)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.go{margin-top:auto;font-weight:600;color:var(--cyan);display:inline-flex;gap:8px;align-items:center}
.go span{transition:transform .2s}.card:hover .go span{transform:translateX(5px)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-Completada{color:var(--green);background:var(--ok-bg)}.s-En-ejecución{color:var(--blue);background:var(--run-bg)}
.s-En-validación{color:var(--amber);background:var(--val-bg)}.s-Pendiente{color:var(--gray);background:var(--pend-bg)}.s-Bloqueada{color:var(--red);background:var(--block-bg)}
.flag{display:inline-flex;font-size:12px;font-weight:600;border-radius:8px;padding:1px 8px;border:1px solid;white-space:nowrap}
.flag.red{color:var(--red)}.flag.amb{color:var(--amber)}.flag.grn{color:var(--green)}
.ev{display:inline-flex;align-items:center;font-size:12px;border-radius:8px;padding:2px 9px;border:1px solid;white-space:nowrap}
.ev.verificada{color:var(--green)}.ev.sin_comprobar{color:var(--amber)}.ev.sin_evidencia{color:var(--red)}
/* vista proyectos */
.split{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
.sw{position:sticky;top:76px;display:flex;flex-direction:column;gap:6px}
.sw button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;transition:border-color .2s,transform .15s;border-left:3px solid var(--pc)}
.sw button:hover{transform:translateX(3px);border-color:var(--line2)}
.sw button[aria-current="true"]{border-color:var(--pc);background:var(--run-bg)}
.sw small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.sw b{font-weight:600}
.pd h1{font-size:clamp(28px,3.6vw,42px);margin-bottom:8px}
.cnt{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.cnt div{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--muted)}
.cnt b{color:var(--text);font-family:var(--mono);font-size:16px;margin-right:6px}
.tl{position:relative;margin:0 0 6px;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:13px 16px;margin-bottom:10px;transition:border-color .2s,transform .15s}
.tli:hover{border-color:var(--cyan);transform:translateX(3px)}
.tli::before{content:"";position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--gray));border:3px solid var(--bg2)}
.tli .t{font-weight:600;margin:2px 0}.tli .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tli .top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.date{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* muro de evidencias */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}
.seg button{background:none;border:0;padding:8px 14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--run-bg);color:var(--text)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;text-decoration:none;color:var(--text);transition:transform .2s,border-color .2s}
a.tile:hover{transform:translateY(-3px);border-color:var(--cyan)}
.tile .pv{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--panel-s),var(--bg2));display:grid;place-items:center;overflow:hidden}
.tile .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.tile .ph svg{width:34px;height:34px;stroke:var(--cyan);fill:none;stroke-width:1.5}
.tile.none{border-style:dashed}
.tile.none .ph svg{stroke:var(--red)}
.tile .tc{padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.tile .tc span{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tile .tc small{color:var(--muted);font-size:12.5px}
/* matriz */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{background:var(--panel-s);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;min-width:170px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:960px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .2s}tr.click:hover{background:var(--panel)}
.muted{color:var(--muted)}
/* control */
.iss{border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.iss summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px}
.iss summary::-webkit-details-marker{display:none}
.iss summary b{font-family:var(--mono);font-size:18px;min-width:28px}
.iss summary .tt{font-weight:600}.iss summary small{display:block;color:var(--muted);font-weight:400}
.iss.ok summary b{color:var(--green)}.iss.warn summary b{color:var(--amber)}
.iss[open] summary{border-bottom:1px solid var(--line)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(2,4,9,.65);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--panel-s);border-left:1px solid var(--line2);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:31;overflow:auto;padding:26px}
.drawer.on{transform:none}
.drawer h3{font-family:var(--disp);font-size:24px;letter-spacing:-.02em;margin:6px 0 10px;font-weight:600}
.dclose{float:right}
.sec{margin-top:22px}
.sec h4{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:500}
.sec p,.sec ul{margin:0}.sec ul{padding-left:18px}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.kvs dt{color:var(--muted)}.kvs dd{margin:0}
.evl{display:flex;flex-direction:column;gap:8px}
.evi{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}
.evi .tp{font-size:12px;color:var(--muted)}

const SNAPSHOT=[];

/* Mapa de ruta: etapas del proyecto (config.json). Cumplida = todas sus tareas realizadas (no equivale a validada). */
function etapasOf(p,L){return(p.etapas||[]).map(e=>{const T=L.filter(a=>a.etapa===e.n),d=T.filter(done).length;
  const s=e.estado==="cumplida"?"ok":e.estado==="en curso"?"cur":e.estado==="pendiente"?"todo":(T.length&&d===T.length?"ok":T.length?"cur":"todo");
  return{...e,T,d,s}})}
function ruta(p,L,big){
  const E=etapasOf(p,L);if(!E.length)return"";
  return `<div class="ruta ${big?"big":""}" role="list" aria-label="Mapa de ruta">${E.map((e,i)=>`<div class="et ${e.s}" role="listitem" style="--i:${i}" title="${esc(e.n)}: ${e.s==="ok"?"cumplida":e.s==="cur"?"en curso":"sin tareas aún"}${e.nota?" · "+esc(e.nota):""}"><i aria-hidden="true"></i><b>${esc(e.n)}</b><small>${e.T.length?e.d+" de "+e.T.length+(e.T.length>1?" tareas":" tarea"):(e.nota?"según el responsable":"sin tareas aún")}</small></div>`).join("")}</div>`;
}
function card(p,i){

   ${(p.etapas||[]).length?ruta(p,L,false):""}<div class="seq" ${(p.etapas||[]).length?"hidden":""} aria-label="Secuencia de tareas">${L.map((a,j)=>`${j?`<span class="ln ${done(a)?"f":""}" style="--i:${j}"></span>`:""}<span class="nd ${done(a)?"f":""} ${a.vencida?"ov":""}" style="--i:${j}" title="${esc(a.titulo)}"></span>`).join("")}</div>
   <dl class="facts"><dt>Realizadas</dt><dd>${d} de ${L.length}</dd><dt>${hi?"★ Hito":"Último avance"}</dt><dd>${last?esc(last.titulo)+" · "+fmt(last.fecha):"Aún sin tareas realizadas"}</dd>
   <dt>Atención</dt><dd>${ov?`<span class="flag red">${ov} vencida${ov>1?"s":""}</span>`:"Sin vencidas"}</dd><dt>Evidencia</dt><dd>${ev} de ${L.length} con enlace</dd></dl>

async function copiarResumen(btn){

/* Portada: los hitos destacados (hasta 3, los más recientes) con su evidencia. Sin hitos marcados, muestra las últimas realizadas. */
const lkBtn=(e,a,i)=>`<a class="lk" href="${esc(e.url)}" target="_blank" rel="noopener" data-prev="${a.id}|${i}" title="${esc(e.nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[e.tipo]||ICON.Enlace}</svg>${e.verif==="verificada"?"Ver evidencia ✓":"Ver evidencia"}<small>${esc(e.tipo)}</small></a>`;

/* Comparación con el período inmediatamente anterior: se cruzan las tareas por su texto (clave). */
function compareData(){
  if(sel==="acum")return null;
  const i=PERIODS.findIndex(p=>p.id===sel);if(i<1)return null;
  const prev=PERIODS[i-1],pa=(prev.actividades||[]).map(a=>({...a,clave:mkClave(a),enlaces:a.enlaces||[]}));
  const pm=new Map(pa.map(a=>[a.clave,a]));
  return{prev,prevDone:pa.filter(done).length,prevTotal:pa.length,
    cerradas:A.filter(a=>done(a)&&pm.has(a.clave)&&!done(pm.get(a.clave))),
    nuevas:A.filter(a=>!pm.has(a.clave)),
    siguen:A.filter(a=>!done(a)&&pm.has(a.clave)&&!done(pm.get(a.clave)))};
}
function vCompare(){
  const c=compareData();if(!c)return"";

   <text x="56" y="14">listadas</text><rect x="104" y="6" width="10" height="10" rx="2" style="fill:var(--line2)"/><text x="124" y="14">realizadas</text><rect x="186" y="6" width="10" height="10" rx="2" style="fill:var(--green)"/></svg>

/* ===== matriz ===== */
function vMatriz(){
  const areas=[...new Set(A.map(a=>a.area).filter(Boolean))].sort();
  const L=A.filter(a=>(!mEstado||a.estado===mEstado)&&(!mProy||a.proyecto===mProy)&&(!mArea||(mArea==="__sin"?!a.area:a.area===mArea))&&(!mQ||(a.titulo+" "+a.original+" "+a.id).toLowerCase().includes(mQ.toLowerCase()))).sort(sortF);
  return `<p class="eyebrow">Fuente central</p><h1 style="font-size:clamp(28px,3.6vw,42px)">Matriz de tareas</h1>
  <p class="lead">Una fila por tarea del Excel (${A.length}). Haz clic en una fila para abrir su detalle.</p>
  <div class="tools"><input id="q" placeholder="Buscar tarea" value="${esc(mQ)}" aria-label="Buscar">
   <select id="fe" aria-label="Estado"><option value="">Todos los estados</option>${ESTADOS.map(e=>`<option ${e===mEstado?"selected":""}>${e}</option>`).join("")}</select>
   <select id="fp" aria-label="Proyecto"><option value="">Todos los proyectos</option>${PR.map(p=>`<option value="${p.id}" ${p.id===mProy?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select>
   <select id="fa" aria-label="Área"><option value="">Todas las áreas</option>${areas.map(x=>`<option ${x===mArea?"selected":""}>${esc(x)}</option>`).join("")}<option value="__sin" ${mArea==="__sin"?"selected":""}>Sin área</option></select></div>
  <div class="scroll"><table><thead><tr><th>ID</th><th>Tarea</th><th>Proyecto</th><th>Área</th><th>Estado</th><th>Fecha</th><th>Evidencia</th></tr></thead><tbody>
  ${L.map(a=>`<tr class="click" data-act="${a.id}" tabindex="0"><td>${a.id}</td><td>${esc(a.titulo)}</td><td><span class="pchip" style="--pc:${P[a.proyecto].color}"><i></i>${esc(P[a.proyecto].nombre)}</span></td><td>${a.area?esc(a.area):'<span class="muted">—</span>'}</td><td>${badge(a.estado)}${a.vencida?' <span class="flag red">Vencida</span>':""}</td><td>${fmt(a.fecha)}${a.fechaNota?' <span title="Fecha corregida: ver detalle" class="flag amb">*</span>':""}</td><td><span class="ev ${evBest(a)}">${a.enlaces.length?a.enlaces.length+" enlace"+(a.enlaces.length>1?"s":""):"Sin evidencia"}</span></td></tr>`).join("")||'<tr><td colspan="7">Sin resultados.</td></tr>'}</tbody></table></div>`;
}

/* ===== control de datos (para quien prepara el informe) ===== */
function issues(){return[
 {t:"Área por completar",d:"La columna AREA está vacía o dice «OK». Debe indicar el área atendida (Compras, Bodega, RRHH, Comercial…).",L:A.filter(a=>!a.area)},
 {t:"Fechas corregidas automáticamente",d:"El Excel tenía la fecha mal digitada. Se interpretó como indica el detalle de cada tarea; conviene corregirla en el Excel.",L:A.filter(a=>a.fechaNota)},
 {t:"Sin fecha",d:"No tienen fecha en la columna COMPLETAR.",L:A.filter(a=>!a.fecha)},
 {t:"Proyecto por confirmar",d:"El proyecto se asignó por cercanía o por palabras clave y no por un dato explícito.",L:A.filter(a=>a.porConfirmar||a.proyecto==="sin")},
 {t:"Posibles duplicados",d:"Texto idéntico o muy parecido a otra tarea.",L:A.filter(a=>a.duplicadoDe)},
 {t:"Realizadas sin enlace de evidencia",d:"Agrega el enlace en la columna ENLACE del Excel.",L:A.filter(a=>done(a)&&!withEv(a))},
 {t:"Tareas sin etapa",d:"Su proyecto tiene mapa de ruta, pero no coinciden con ninguna etapa; quedan fuera del mapa.",L:A.filter(a=>(P[a.proyecto]&&(P[a.proyecto].etapas||[]).length)&&!a.etapa)},
 {t:"Redacción automática sin revisar",d:"No tienen un título redactado en config.json; se muestra el texto del Excel en minúsculas.",L:A.filter(a=>a.tituloAuto)}
]}
function vControl(){
  const I=issues();
  return `<p class="eyebrow">Para quien prepara el informe</p><h1 style="font-size:clamp(28px,3.6vw,42px)">Control de datos</h1>

  ${I.map(i=>`<details class="iss ${i.L.length?"warn":"ok"}" ${i.L.length&&i.L.length<8?"open":""}><summary><b>${i.L.length}</b><span class="tt">${i.t}<small>${i.d}</small></span></summary>
   ${i.L.length?i.L.map(a=>`<button class="row" data-act="${a.id}"><span class="date">${a.id}</span><div><div class="t">${esc(a.titulo)}</div><div class="m">${esc(P[a.proyecto].nombre)}${a.fechaNota?" · "+esc(a.fechaNota):""}${a.duplicadoDe?" · posible duplicado de "+esc(a.duplicadoDe):""}</div></div></button>`).join(""):'<div class="empty">Todo en orden.</div>'}</details>`).join("")}`;
}

/* ===== detalle ===== */
function drawerHTML(a){
  const li=(t,v)=>v?`<dt>${t}</dt><dd>${esc(v)}</dd>`:"";
  const sec=(t,v)=>v?`<div class="sec"><h4>${t}</h4><p>${esc(v)}</p></div>`:"";
  return `<button class="btn dclose" id="dc">Cerrar ✕</button>
  <span class="date">${a.id} · fila ${a.fila} del Excel</span><h3>${a.destacada?STAR:""}${esc(a.titulo)}</h3>${badge(a.estado)} ${a.vencida?'<span class="flag red">Vencida</span>':a.venceHoy?'<span class="flag amb">Vence hoy</span>':""}
  <div class="sec"><h4>Datos</h4><dl class="kvs"><dt>Proyecto</dt><dd><span class="pchip" style="--pc:${P[a.proyecto].color}"><i></i>${esc(P[a.proyecto].nombre)}</span></dd>
   ${li("Área",a.area||"Por completar")}${li(done(a)?"Fecha de realización":"Fecha objetivo",a.fecha?fmt(a.fecha)+" "+a.fecha.slice(0,4):"Sin fecha")}${li("Entregable",a.entregable)}${li("Responsable",a.responsable)}</dl></div>
  ${sec("Contexto",a.contexto)}${sec("Resultado",a.resultado)}
  <div class="sec"><h4>Evidencias</h4><div class="evl">${a.enlaces.length?a.enlaces.map((e,i)=>`<div class="evi"><div><a href="${esc(e.url)}" target="_blank" rel="noopener" data-prev="${a.id}|${i}">${esc(e.nombre)}</a><div class="tp">${e.tipo}</div></div><span class="ev ${e.verif}">${VERIF[e.verif]}</span></div>`).join(""):'<div class="evi"><span>No hay evidencia enlazada para esta tarea.</span><span class="ev sin_evidencia">Sin evidencia</span></div>'}</div></div>
  ${sec("Pendiente",a.pendiente||(done(a)?"":"Aún no marcada como realizada."))}${sec("Observaciones",a.nota)}
  ${a.fechaNota?`<div class="sec"><h4>Fecha ajustada</h4><p class="orig">${esc(a.fechaNota)}</p></div>`:""}
  <div class="sec"><h4>Texto original en el Excel</h4><p class="orig">${esc(a.original)}</p></div>`;
}
function openDrawer(id){lastFocus=document.activeElement;const d=$("#drawer");d.innerHTML=drawerHTML(A.find(a=>a.id===id));d.classList.add("on");$("#scrim").classList.add("on");$("#dc").onclick=closeDrawer;$("#dc").focus()}
function closeDrawer(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");if(lastFocus&&lastFocus.isConnected&&lastFocus.focus)lastFocus.focus();lastFocus=null}
$("#scrim").onclick=closeDrawer;

/* ===== visor de evidencia: vista previa donde es técnicamente posible; si no, abre el original ===== */
function lbFail(el){el.outerHTML=`<div class="nopv">${ico("Enlace")}<p>No se pudo cargar la vista previa: el archivo no está disponible o no tienes permisos.</p><p>Prueba con «Abrir original».</p></div>`}
function openPreview(aid,i){
  const a=A.find(x=>x.id===aid),e=a&&a.enlaces[i];if(!e)return;
  lbFocus=document.activeElement;const u=esc(e.url),n=a.enlaces.length;
  let body,foot="";
  /* Solo se previsualiza lo que está guardado en esta misma página (e.asset); un enlace externo no se puede incrustar. */
  if(e.asset===true&&e.tipo==="Imagen")body=`<img src="${u}" alt="${esc(e.nombre)}" onerror="lbFail(this)">`;
  else if(e.asset===true&&e.tipo==="Video"){body=`<video src="${u}" controls onerror="lbFail(this)"></video>`;foot="Si el video no se reproduce, usa «Abrir original»."}
  else if(e.asset===true&&e.tipo==="PDF"){body=`<iframe src="${u}" title="${esc(e.nombre)}"></iframe>`;foot="Si el documento no se muestra, usa «Abrir original»."}
  else body=`<div class="nopv">${ico(e.tipo)}<p>La vista previa no está disponible para este enlace (${esc(e.tipo)}): está guardado fuera de esta página.</p><p>«Abrir original» lo abre en una pestaña nueva, con tus permisos.</p></div>`;
  const lb=$("#lb");
  lb.innerHTML=`<div class="lbc"><div class="lbh"><div class="ti"><b>${esc(e.nombre)}</b><small>${esc(a.titulo)} · ${esc(P[a.proyecto].nombre)} · ${esc(e.tipo)} · ${VERIF[e.verif]}</small></div>
   <div class="ac">${n>1?`<button class="btn" id="lbp" aria-label="Anterior">←</button><button class="btn" id="lbn" aria-label="Siguiente">→</button>`:""}<a class="btn pri" href="${u}" target="_blank" rel="noopener" style="text-decoration:none">Abrir original ↗</a><button class="btn" id="lbx">Cerrar ✕</button></div></div>
   <div class="lbb">${body}</div>${foot?`<div class="lbf">${foot}</div>`:""}</div>`;
  lb.classList.add("on");$("#lbx").onclick=closePreview;lb.onclick=ev=>{if(ev.target===lb)closePreview()};
  if(n>1){$("#lbp").onclick=()=>openPreview(aid,(i-1+n)%n);$("#lbn").onclick=()=>openPreview(aid,(i+1)%n)}
  $("#lbx").focus();
}
function closePreview(){const lb=$("#lb");lb.classList.remove("on");lb.innerHTML="";if(lbFocus&&lbFocus.isConnected&&lbFocus.focus)lbFocus.focus();lbFocus=null}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-prev]");if(a&&e.button===0&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();const[id,i]=a.dataset.prev.split("|");openPreview(id,+i)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lb").classList.contains("on"))closePreview();else closeDrawer()}});

/* ===== partículas suaves del hero ===== */
function startFx(cv){
  if(RM||!cv)return null;const g=cv.getContext("2d");let W,H,pts=[],raf,mx=-999,my=-999;
  const size=()=>{const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(70,Math.round(W*H/15000));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))};
  size();const ro=new ResizeObserver(size);ro.observe(cv);
  cv.parentElement.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
  cv.parentElement.addEventListener("mouseleave",()=>{mx=my=-999});
  (function f(){raf=requestAnimationFrame(f);if(document.hidden)return;g.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<90){p.x+=dx/d*.8;p.y+=dy/d*.8}
      g.fillStyle="rgba(34,211,238,.55)";g.beginPath();g.arc(p.x,p.y,1.4,0,6.3);g.fill()}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<110){g.strokeStyle=`rgba(91,140,255,${.22*(1-d/110)})`;g.lineWidth=1;g.beginPath();g.moveTo(pts[i].x,pts[i].y);g.lineTo(pts[j].x,pts[j].y);g.stroke()}}})();
  return()=>{cancelAnimationFrame(raf);ro.disconnect()};
}

/* ===== ruteo ===== */
let cur=location.hash||"#resumen";
function go(h){try{location.hash=h}catch(e){}cur=h;closeDrawer();render()}
function route(){const h=cur;if(h.startsWith("#proyecto/"))return{v:"proyectos",id:h.split("/")[1]};const k=h.slice(1);if(k==="evidencias")return{v:"realizadas"};if(k==="control"&&EDITOR)return{v:"control"};return{v:["matriz","proyectos","historial","realizadas"].includes(k)?k:"resumen"}}
/* Estados de la página antes de tener datos: carga, sin acceso, error, base vacía. */
function stateView(){
  const box=(h,t)=>`<div class="ldg"><div style="max-width:46ch"><p class="eyebrow">Centro de Avances</p><h1 style="font-size:clamp(24px,4vw,38px)">${h}</h1><p class="lead" style="margin:0 auto">${t}</p></div></div>`;
  if(dbState==="cargando")return `<div class="ldg"><div><div class="sp"></div>Cargando los avances…</div></div>`;
  if(dbState==="nodb")return box("No se pudo abrir la base de datos","Abre este enlace con tu cuenta de Claude. Si ya lo hiciste, pide acceso a quien te lo compartió.");
  if(dbState==="error")return box("No se pudieron leer los avances","Recarga la página en unos segundos. Si la abriste como archivo suelto en tu computador, ábrela desde su enlace: los datos viven en archivos junto a la página. Si sigue igual, avisa a quien mantiene el tablero.");
  if(!PERIODS.length)return box("Aún no hay períodos cargados","Cuando se cargue el primero con el skill «tablero-avances», aparecerá aquí con sus tareas, evidencias e historial.");
  return null;
}
function viewHTML(r){return r.v==="resumen"?vResumen():r.v==="realizadas"?vRealizadas():r.v==="matriz"?vMatriz():r.v==="historial"?vHistorial():r.v==="control"?vControl():vProyectos(r.id)}
function render(keep){
  if(stopFx){stopFx();stopFx=null}
  const r=route(),sv=stateView(),ready=!sv,nIss=ready&&EDITOR?issues().filter(i=>i.L.length).length:0;
  /* Quien solo mira ve 4 pestañas; la matriz y el control de datos son para quien prepara el informe. */
  const tabs=[["resumen","Resumen","Resumen",'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'],["realizadas","Tareas realizadas","Tareas",'<path d="M5 12l4 4 10-10"/>'],["proyectos","Proyectos","Proyectos",'<path d="M3 7h7l2 2h9v10H3z"/>'],["historial","Historial","Historial",'<path d="M12 7v5l3 2M21 12a9 9 0 1 1-3-6.7"/>']];
  if(EDITOR){tabs.push(["matriz","Matriz","Matriz",'<path d="M4 4h16v16H4zM4 10h16M10 4v16"/>']);tabs.push(["control","Control de datos","Control",'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'])}
  $("#tabs").innerHTML=ready?tabs.map(([k,l,s,ic])=>`<button class="tab" data-go="#${k}" ${k===r.v?'aria-current="page"':""}><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span class="lg">${l}</span><span class="sh">${s}</span>${k==="control"&&nIss?`<span class="cb">${nIss}</span>`:""}</button>`).join(""):"";
  const ps=$("#persel");
  if(ready){ps.hidden=false;ps.innerHTML=PERIODS.slice().reverse().map(p=>`<option value="${esc(p.id)}" ${p.id===sel?"selected":""}>${esc(plabel(p))}</option>`).join("")+`<option value="acum" ${sel==="acum"?"selected":""}>Acumulado</option>`}else ps.hidden=true;
  const m=$("#main"),y=window.scrollY;
  m.innerHTML=sv||viewHTML(r);
  if(ready)wire(m);
  window.scrollTo(0,keep?y:0);
  if(ready&&r.v==="resumen")stopFx=startFx($("#fx"));
}
function wire(m){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-scroll]").forEach(b=>b.onclick=()=>{$("#"+b.dataset.scroll).scrollIntoView({behavior:RM?"auto":"smooth",block:"start"})});
  m.querySelectorAll("[data-act]").forEach(el=>{el.onclick=()=>openDrawer(el.dataset.act);el.onkeydown=e=>{if(e.key==="Enter")openDrawer(el.dataset.act)}});
  m.querySelectorAll("[data-state]").forEach(b=>{
    b.onclick=()=>{mEstado=b.dataset.state;mProy=mArea=mQ="";go("#matriz")};
    const svg=m.querySelector(".ring"),on=()=>{svg.classList.add("dim");svg.querySelectorAll(".seg").forEach(s=>s.classList.toggle("hot",s.dataset.e===b.dataset.state))},off=()=>svg.classList.remove("dim");
    b.onmouseenter=on;b.onfocus=on;b.onmouseleave=off;b.onblur=off});
  m.querySelectorAll("[data-iso]").forEach(b=>{const on=()=>m.querySelectorAll("#strip .dot").forEach(d=>d.classList.toggle("dim",d.dataset.p!==b.dataset.iso)),off=()=>m.querySelectorAll("#strip .dot").forEach(d=>d.classList.remove("dim"));
    b.onmouseenter=on;b.onfocus=on;b.onmouseleave=off;b.onblur=off;b.onclick=()=>{mProy=b.dataset.iso;mEstado=mArea=mQ="";go("#matriz")}});
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copiarResumen(b));
  m.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{sel=b.dataset.sel;applyData();go("#resumen")});
  m.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{rView=b.dataset.rv;rerender()});
  m.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>{rEv=b.dataset.re;rerender()});
  m.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{rProy=b.dataset.rp;rerender()});
  const q=$("#q");
  if(q){q.oninput=()=>{mQ=q.value;const s=q.selectionStart;rerender();const n=$("#q");n.focus();n.setSelectionRange(s,s)};
    $("#fe").onchange=e=>{mEstado=e.target.value;rerender()};$("#fp").onchange=e=>{mProy=e.target.value;rerender()};$("#fa").onchange=e=>{mArea=e.target.value;rerender()}}
  /* tooltip de puntos */
  const tip=$("#tip");
  m.querySelectorAll("[data-tip]").forEach(el=>{const show=()=>{const r=el.getBoundingClientRect();tip.innerHTML=`<b>${el.dataset.tip}</b><small>${el.dataset.tip2}</small>`;tip.classList.add("on");const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";tip.style.top=(r.top-tip.offsetHeight-10<8?r.bottom+10:r.top-tip.offsetHeight-10)+"px"},hide=()=>tip.classList.remove("on");
    el.onmouseenter=show;el.onfocus=show;el.onmouseleave=hide;el.onblur=hide});
  m.querySelectorAll(".card").forEach(c=>c.onmousemove=e=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")});
  const rv=m.querySelectorAll(".reveal:not(.in)");
  if(RM||!("IntersectionObserver" in window))rv.forEach(x=>x.classList.add("in"));
  else{const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{threshold:.1});rv.forEach(x=>io.observe(x))}
  /* El número real se escribe primero; la animación de conteo solo corre si el navegador la ejecuta (pestaña visible). */
  m.querySelectorAll("[data-to]").forEach(el=>{const to=+el.dataset.to;el.textContent=to;if(RM)return;
    let t0=null;requestAnimationFrame(function f(t){if(t0===null)t0=t;const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})});
  requestAnimationFrame(()=>requestAnimationFrame(()=>m.querySelectorAll(".ring .seg").forEach(s=>s.style.strokeDasharray=s.dataset.d)));
}
function rerender(){render(true)}
window.addEventListener("hashchange",()=>{const h=location.hash||"#resumen";if(h!==cur){cur=h;closeDrawer();render()}});

/* ===== arranque: lee los períodos de la base de datos y se actualiza solo cuando cambian ===== */
$("#persel").onchange=e=>{sel=e.target.value;applyData();render()};
if(SNAPSHOT.length){PERIODS=SNAPSHOT.slice().sort(byDesde);dbState="ok";applyData()}
render();
/* Alojamiento propio (GitHub Pages): los datos son archivos junto a la página. data/index.json lista los períodos y cada uno
   está en data/periodos/<id>.json. La página (HTML) no cambia: quien carga un período solo agrega su archivo. */
async function cargarHospedado(){
  const v="?v="+Date.now(),get=async u=>{const r=await fetch(u+v,{cache:"no-store"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()};
  try{
    const idx=await get("data/index.json");
    const docs=await Promise.all((idx.periodos||[]).map(id=>get("data/periodos/"+encodeURIComponent(id)+".json")));
    PERIODS=docs.sort(byDesde);dbState="ok";applyData();render(true);
  }catch(e){if(!SNAPSHOT.length){dbState="error"}render(true)}
}
/* La copia incluida se muestra al instante; la base de datos, si responde, aporta lo más reciente. */
const fallback=()=>{if(!SNAPSHOT.length){dbState="nodb";render(true)}};
(async()=>{
  try{
    if(!window.claude||!window.claude.use){await cargarHospedado();return}
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    try{EDITOR=user?await user.canEdit():false}catch(e){EDITOR=false}
    if(!db){fallback();render(true);return}
    db.collection("periodos").onSnapshot(snap=>{
      if(snap.empty){if(!SNAPSHOT.length&&!(snap.metadata&&snap.metadata.fromCache)){PERIODS=[];dbState="ok";applyData();render(true)}return}
      PERIODS=snap.docs.map(d=>({...d.data(),id:d.id})).sort(byDesde);
      dbState="ok";applyData();render(true);
    },e=>{if(!SNAPSHOT.length){dbState=e&&e.code==="revoked"?"nodb":"error"}render(true)});
  }catch(e){if(!SNAPSHOT.length)dbState="error";render(true)}
})();
</script>
